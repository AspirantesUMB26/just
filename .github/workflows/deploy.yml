name: Desplegar a GitHub Pages

on:
  push:
    branches: ["main"] # Se dispara cada vez que haces push a la rama main

# Permisos necesarios para generar el token de despliegue
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue a la vez para evitar conflictos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código fuente
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefactos web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Carpeta raíz donde está tu index.html

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
